name: Java CI/CD pipeline
  on: 
   push:
    branches:['main']
   pull_request:
    branches:['main']
  workflow_dispatch:

jobs:
 
   build:
    runs-on:Windows-latest

    steps:
            -name:Checkout Repository
             uses:actions/checkout@v4

            -name:Set up JDK 17
             uses:actions/Setup java@v5
        with: 
              java-version:'17'
              distribution:'temurin'

            -name:Compile the Java program
             run:javac code.java

            -name:Run the Java program
             run:java code