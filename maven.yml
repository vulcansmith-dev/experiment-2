name: Java CI/CD pipeline
  on 
   push:
    branches:['Main']
  pull_request:
    branches:['Main']
  workflow_dispatch:

jobs:
 
   build:
    runs-on:Windows-latest

    steps:
            -name:Checkout Repository
       uses:actions/checkout@v4

      -name:Set up JDK 25

        uses:actions/Setup java@v4

        with: 
              java-version:'25'

              distribution:'temurin'

      -name:Compile the Java program

        run:javac code.java


      -name:Run the Java program
        run:java code